const globe=`<svg class="globe" viewBox="0 0 420 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematischer Globus mit Längen- und Breitengraden"><defs><clipPath id="ball"><circle cx="210" cy="145" r="124"/></clipPath></defs><circle cx="210" cy="145" r="124" fill="#d9edff" stroke="#215b94" stroke-width="3"/><g clip-path="url(#ball)" fill="none" stroke="#6599c9" stroke-width="2"><ellipse cx="210" cy="145" rx="35" ry="124"/><ellipse cx="210" cy="145" rx="82" ry="124"/><path d="M86 145H334 M97 90Q210 120 323 90 M97 200Q210 170 323 200 M122 48Q210 75 298 48 M122 242Q210 215 298 242"/><path d="M210 21V269" stroke="#db6c36" stroke-width="4"/><path d="M86 145H334" stroke="#149f75" stroke-width="4"/></g><text x="337" y="150" font-size="13" fill="#127a5c">Äquator</text><text x="215" y="17" font-size="13" fill="#a84e2b">Greenwich</text></svg>`;
function speak(s){
 if(!('speechSynthesis' in window)){alert('Dieser Browser unterstützt keine Sprachausgabe. Bitte Microsoft Edge verwenden.');return;}
 const synth=window.speechSynthesis;
 const start=()=>{
  let voices=synth.getVoices();
  let ar=voices.find(v=>/^ar(-|$)/i.test(v.lang) && /EG|SA/i.test(v.lang)) || voices.find(v=>/^ar(-|$)/i.test(v.lang));
  if(!ar){alert('Keine arabische Computerstimme gefunden. Bitte in Windows eine arabische Sprache mit Sprachausgabe installieren und die Datei danach in Microsoft Edge neu öffnen. Die App enthält keine aufgenommenen Audiodateien.');return;}
  synth.cancel();
  let u=new SpeechSynthesisUtterance(s);
  u.voice=ar;u.lang=ar.lang;u.rate=.78;u.pitch=1;u.volume=1;
  u.onerror=(e)=>{if(e.error!=='interrupted'&&e.error!=='canceled')alert('Die Sprachausgabe konnte nicht gestartet werden ('+e.error+'). Bitte Edge und die installierte arabische Stimme prüfen.');};
  synth.speak(u);
 };
 if(synth.getVoices().length){start();}else{
  let done=false;
  const later=()=>{if(done)return;done=true;start();};
  synth.addEventListener('voiceschanged',later,{once:true});
  setTimeout(later,900);
 }
}
function btn(t,fn,cl=''){let b=el('button',{className:cl},t);b.onclick=fn;return b}
function section(){persist();let names=[['lernen','📖 Lernen'],['quiz','✍️ Üben'],['pruefung','🏆 Prüfung'],['fehler','🔁 Fehlertraining'],['buch','📚 Originalseiten']];$('#tabs').replaceChildren(...names.map(([id,name])=>btn(name,()=>{tab=id;render()},tab===id?'active':'')))}
function render(){persist();section();let v=$('#view');v.replaceChildren();if(tab==='lernen')learn(v);else if(tab==='buch')book(v);else if(tab==='fehler')startScreen(v,true);else if(tab==='quiz'||tab==='pruefung')startScreen(v,false)}
function learn(v){let x=lessons[card],d=el('div',{className:'card'});d.innerHTML=`<span class="tag">Lernkarte ${card+1} von ${lessons.length} · Buchseite ${x[3]}</span><h2>${x[0]}</h2><div class="ar heroar" lang="ar">${x[1]}</div>${card<3?globe:''}<p>${x[2]}</p>`;d.append(btn('🔊 Arabisch vorlesen',()=>speak(x[1])));let a=el('div',{className:'actions'});a.append(btn('← Zurück',()=>{card=Math.max(0,card-1);render()}),btn('Weiter →',()=>{card=Math.min(lessons.length-1,card+1);render()},'primary'));d.append(a);let done=btn(completed.includes(card)?'✓ Gelernt – nochmal markieren':'✓ Diese Karte gelernt',()=>{if(!completed.includes(card))completed.push(card);persist();render()},'primary');d.append(done);d.append(el('p',{className:'muted'},completed.length+' von '+lessons.length+' Lernkarten gelernt · wird automatisch gespeichert'));v.append(d);if(card===lessons.length-1)v.append(btn('Jetzt Fragen üben →',()=>{tab='quiz';render()},'primary'))}
function book(v){let d=el('div',{className:'card'});d.innerHTML='<h2>Alle 6 Originalseiten</h2><p>Die Buchseiten sind in dieser Datei enthalten und können ohne Internet angesehen werden. Seiten 1–3: Stoff; Seiten 4–6: Aufgaben. Die Originalseiten dienen zum Nachschlagen; die interaktiven Fragen sind teilweise vereinfacht und nicht wortwörtlich abgeschrieben.</p>';let sel=el('select');sel.style='font-size:17px;padding:9px;border-radius:9px';images.forEach((_,i)=>sel.add(new Option('Seite '+(i+1),i)));let im=el('img',{className:'source',src:images[0],alt:'Buchseite 1'});sel.onchange=()=>{im.src=images[+sel.value];im.alt='Buchseite '+(+sel.value+1)};d.append(sel,im);v.append(d)}
function startScreen(v,onlyWrong){if(order.length&&((onlyWrong&&mode==='wrong')||(!onlyWrong&&mode===tab))){questionView(v);return}let d=el('div',{className:'card'});let available=onlyWrong?JSON.parse(localStorage.getItem('dirasat_mistakes')||'[]'):questions.map((_,i)=>i);d.innerHTML=`<h2>${onlyWrong?'Fehlertraining':tab==='pruefung'?'Prüfungsmodus':'Übungsmodus'}</h2><p>${onlyWrong?'Hier werden falsch beantwortete Fragen erneut geübt.':tab==='pruefung'?'Alle Fragen ohne deutsche Hilfe. Am Ende gibt es ein Ergebnis.':'Alle Fragen Schritt für Schritt mit deutscher Erklärung.'}</p><p><strong>${available.length} Fragen</strong></p>`;if(!available.length){d.append(el('p',{},'Noch keine Fehler gespeichert. Gut gemacht!'));v.append(d);return}d.append(btn('▶ Starten',()=>{mode=onlyWrong?'wrong':tab;order=[...available];idx=0;score=0;chosen=null;questionView(v)},'primary'));v.append(d)}
function questionView(v){persist();v.replaceChildren();if(idx>=order.length){let d=el('div',{className:'card center'});d.innerHTML=`<h2>🎉 Fertig!</h2><h1>${score} / ${order.length} richtig</h1><p>${Math.round(100*score/order.length)} %</p><p>Wiederhole schwierige Fragen im Fehlertraining.</p>`;d.append(btn('Noch einmal',()=>{order=[];render()},'primary'));v.append(d);return}let n=order[idx],q=questions[n],d=el('div',{className:'card'});d.innerHTML=`<div class="muted">Frage ${idx+1} von ${order.length} · Buchseite ${q[4]}</div><div class="progress"><div style="width:${100*idx/order.length}%"></div></div><h2 class="ar" lang="ar">${q[0]}</h2>`;d.append(btn('🔊 Frage vorlesen',()=>speak(q[0])));if(mode!=='pruefung'){d.append(btn('🇩🇪 Deutsche Hilfe',()=>{let h=$('#help');h.classList.toggle('hidden')}));let help=el('p',{id:'help',className:'muted hidden'},q[3]);d.append(help)}let opts=el('div',{className:'options'});q[1].forEach((s,i)=>{let b=btn(s,()=>{if(chosen!==null)return;chosen=i;let ok=i===q[2];if(ok)score++;else{let old=JSON.parse(localStorage.getItem('dirasat_mistakes')||'[]');if(!old.includes(n)){old.push(n);localStorage.setItem('dirasat_mistakes',JSON.stringify(old))}}persist();questionView(v)});if(chosen!==null){b.disabled=true;if(i===q[2])b.classList.add('correct');if(i===chosen&&i!==q[2])b.classList.add('wrong')}opts.append(b)});d.append(opts);if(chosen!==null){let p=el('p',{className:chosen===q[2]?'ok':'bad'},chosen===q[2]?'✓ Richtig!':'✗ Noch nicht richtig. Die grüne Antwort ist richtig.');d.append(p,el('p',{},q[3]),btn('Nächste Frage →',()=>{idx++;chosen=null;questionView(v)},'primary'))}v.append(d)}
let controls=document.createElement('section');controls.className='card';controls.innerHTML='<h3>💾 Lernstand speichern</h3><p>Dein Fortschritt wird automatisch auf diesem Gerät und in diesem Browser gespeichert. Du kannst jederzeit schließen und später weitermachen. Auf einem anderen Gerät wird der Lernstand NICHT automatisch übertragen. Privatmodus oder gelöschte Browserdaten können ihn löschen.</p>';controls.append(btn('⬇ Sicherung herunterladen',exportSave));let up=document.createElement('input');up.type='file';up.accept='.json,application/json';up.style='display:block;margin-top:12px';up.onchange=()=>{if(up.files[0])importSave(up.files[0])};controls.append(document.createTextNode('  Sicherung wiederherstellen: '),up);document.querySelector('main').append(controls);render();</script></body></html>
